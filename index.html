<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./assets/icons/fotogram_Logo.svg">
</head>

<body onload="renderImages()">
    <header>
        <div class="header_content">
            <img src="./assets/icons/fotogram_text_Logo.svg" alt="fotogram icon">
        </div>
    </header>
    <main>
        <h1>Your personal photo album</h1>
        <section class="images" id="images"></section>
    </main>
    <footer>
        <section class="footer_content">
            <img src="./assets/icons/da_Logo.svg" alt="developer akademie logo">
            <p>© 2023 Developer Akademie GmbH</p>
            <img src="./assets/img/footer_background.png" alt="dark blue background" class="footer_background">
        </section>
    </footer>

    <dialog class="image_dialog" id="image_dialog"></dialog>
</body>
<script src="./script.js"></script>

</html>
